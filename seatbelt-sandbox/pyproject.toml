[project]
name = "dcode-seatbelt-sandbox"
version = "0.1.0"
description = "Local sandbox-exec (Seatbelt) sandbox provider for deepagents-code (dcode), for macOS"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
dependencies = [
    "deepagents>=0.7.0",
]

[project.optional-dependencies]
dcode = [
    "deepagents-code",
]
test = [
    "pytest>=9.1.1",
]

[project.entry-points."deepagents_code.sandbox_providers"]
seatbelt = "dcode_seatbelt_sandbox.provider:SeatbeltProvider"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dcode_seatbelt_sandbox"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
