[project]
name = "metalgate-code-cli"
version = "0.1.0"
description = "Launch deepagents code CLI with the evroc model provider and the dynamic_tools plugin"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "deepagents-code==0.1.75",
    "evroc-dcode",
    "dcode-seatbelt-sandbox",
    "dcode-bubblewrap-sandbox",
    "tree-sitter",
    "tree-sitter-python",
    "tree-sitter-go",
    "ty>=0.0.80",
]

[tool.uv.sources]
evroc-dcode = { path = "evroc-dcode", editable = true }
dcode-seatbelt-sandbox = { path = "seatbelt-sandbox", editable = true }
dcode-bubblewrap-sandbox = { path = "bubblewrap-sandbox", editable = true }

[dependency-groups]
dev = [
    "coverage>=7.16.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.5",
    "shellcheck-py>=0.11.0.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--import-mode=importlib"
testpaths = [
    "marketplace/plugins/dynamic_tools/tests",
    "marketplace/plugins/context_tools/tests",
    "seatbelt-sandbox/tests",
    "bubblewrap-sandbox/tests",
]
pythonpath = ["."]
