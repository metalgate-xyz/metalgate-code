[project]
name = "evroc"
version = "0.1.0"
description = "evroc model provider for deepagents code — OpenAI-compatible ChatModel + dynamic model discovery"
requires-python = ">=3.13"
dependencies = [
    "langchain-openai>=1.6.0",
    "requests>=2.28.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["evroc"]
